<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro Inverted QR Scanner</title>
  <!-- jsQR specializes in inverted / white-on-dark QR codes -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
      background: #090d16;
      color: #f8fafc;
    }
    .scanner-wrapper {
      position: relative;
      max-width: 400px;
      margin: 1rem auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #38bdf8;
    }
    video {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
    }
    .target-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      border: 2px dashed #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 0.8rem auto;
      max-width: 400px;
    }
    button {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #475569; }
    .card {
      max-width: 400px;
      margin: 1rem auto;
      padding: 1rem;
      background: #1e293b;
      border-radius: 12px;
      text-align: left;
    }
    .result-text {
      font-size: 1.3rem;
      font-weight: bold;
      color: #38bdf8;
      word-break: break-all;
    }
    .tip-box {
      margin: 0.5rem auto;
      max-width: 400px;
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h3>Micro & Inverted Scanner</h3>

  <div class="tip-box">
    ⚠️ <strong>Do NOT hold camera too close.</strong> Keep phone 15–20 cm away and use 2x/3x zoom so the lens stays focused.
  </div>

  <div class="controls">
    <button id="toggle-btn">Start Camera</button>
    <button id="torch-btn" style="display:none; background:#d97706;">Flashlight</button>
    <button id="reset-btn" disabled style="background: #059669;">Scan Again</button>
  </div>

  <div class="controls" id="zoom-controls" style="display: none;">
    <button onclick="setZoom(1)">1x</button>
    <button onclick="setZoom(2)">2x</button>
    <button onclick="setZoom(3)">3x</button>
    <button onclick="setZoom(4)">4x</button>
  </div>

  <div class="scanner-wrapper">
    <video id="video" playsinline muted></video>
    <div class="target-box"></div>
  </div>

  <!-- Offscreen canvas for raw pixel data -->
  <canvas id="qr-canvas" style="display: none;"></canvas>

  <div class="card">
    <div style="font-size: 0.8rem; color: #94a3b8;">DECODED OUTPUT:</div>
    <div class="result-text" id="result-text">Waiting to scan...</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const toggleBtn = document.getElementById('toggle-btn');
    const resetBtn = document.getElementById('reset-btn');
    const torchBtn = document.getElementById('torch-btn');
    const zoomControls = document.getElementById('zoom-controls');
    const resultText = document.getElementById('result-text');
    const canvas = document.getElementById('qr-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let stream = null;
    let track = null;
    let scanning = false;
    let isPaused = false;
    let torchOn = false;

    toggleBtn.addEventListener('click', () => {
      if (scanning) stopCamera();
      else startCamera();
    });

    resetBtn.addEventListener('click', () => {
      isPaused = false;
      resetBtn.disabled = true;
      resultText.textContent = "Scanning...";
    });

    torchBtn.addEventListener('click', async () => {
      if (!track) return;
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchBtn.textContent = torchOn ? 'Flashlight OFF' : 'Flashlight ON';
    });

    async function setZoom(val) {
      if (!track) return;
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) {
        const target = Math.min(Math.max(val, caps.zoom.min), caps.zoom.max);
        await track.applyConstraints({ advanced: [{ zoom: target }] });
      }
    }

    async function startCamera() {
      try {
        // Enforce maximum available resolution so small codes have high pixel density
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};

        // Show zoom buttons if supported, and auto-zoom to 2.5x
        if (caps.zoom) {
          zoomControls.style.display = 'flex';
          const initZoom = Math.min(2.5, caps.zoom.max);
          await track.applyConstraints({ advanced: [{ zoom: initZoom }] });
        }

        // Show flashlight button if available
        if (caps.torch) {
          torchBtn.style.display = 'inline-block';
        }

        scanning = true;
        isPaused = false;
        toggleBtn.textContent = 'Stop Camera';
        toggleBtn.style.background = '#dc2626';

        requestAnimationFrame(tick);
      } catch (err) {
        alert('Camera Error: ' + err.message);
      }
    }

    function tick() {
      if (!scanning) return;

      if (!isPaused && video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        // jsQR natively checks both black-on-white and white-on-black (inverted)
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "attemptBoth"
        });

        if (code && code.data) {
          handleSuccess(code.data);
        }
      }

      requestAnimationFrame(tick);
    }

    function handleSuccess(data) {
      isPaused = true;
      resultText.textContent = data;
      resetBtn.disabled = false;
      if (navigator.vibrate) navigator.vibrate(100);

      // Auto-unlock after 3 seconds
      setTimeout(() => {
        isPaused = false;
        resetBtn.disabled = true;
      }, 3000);
    }

    function stopCamera() {
      scanning = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      toggleBtn.textContent = 'Start Camera';
      toggleBtn.style.background = '#2563eb';
      zoomControls.style.display = 'none';
      torchBtn.style.display = 'none';
      resetBtn.disabled = true;
    }
  </script>
</body>
</html>
