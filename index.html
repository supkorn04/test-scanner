<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Barcode Scanner</title>
  <!-- Fallback engine for non-Chromium browsers -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
      background: #0f172a;
      color: #f8fafc;
    }
    .scanner-wrapper {
      position: relative;
      max-width: 420px;
      margin: 1rem auto;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    video {
      width: 100%;
      height: 340px;
      object-fit: cover;
      display: block;
    }
    /* Wide reticle sized for horizontal 1D barcodes and square QR codes */
    .viewfinder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78%;
      height: 48%;
      border: 2px dashed #38bdf8;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .scan-line {
      position: absolute;
      top: 50%;
      left: 12%;
      width: 76%;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 0.8rem auto;
      max-width: 420px;
    }
    button {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #475569; }
    .card {
      max-width: 420px;
      margin: 1rem auto;
      padding: 1rem;
      background: #1e293b;
      border-radius: 10px;
      text-align: left;
    }
    .result-text {
      font-size: 1.3rem;
      font-weight: bold;
      color: #38bdf8;
      font-family: monospace;
      word-break: break-all;
      margin-top: 4px;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      background: #334155;
      margin-bottom: 8px;
    }
  </style>
</head>

    <button id="reset-btn" disabled style="background: #059669;">Scan Again</button>
  </div>

  <div class="scanner-wrapper">
    <video id="video" playsinline muted></video>
    <div class="viewfinder"></div>
    <div class="scan-line" id="scan-line"></div>
  </div>

  <div class="card">
    <span class="status-badge" id="status-badge">Status: Idle</span>
    <div style="font-size: 0.8rem; color: #94a3b8;">DECODED ITEM:</div>
    <div class="result-text" id="result-text">Waiting...</div>
    <div style="margin-top: 6px; font-size: 0.8rem; color: #64748b;">
      Format: <span id="result-format">-</span>
    </div>
  </div>
