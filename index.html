<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro & Inverted QR Scanner</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
      background: #090d16;
      color: #f8fafc;
    }
    .scanner-wrapper {
      position: relative;
      max-width: 400px;
      margin: 1rem auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    video {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }
    /* Small targeting box to isolate one of the two codes */
    .viewfinder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .viewfinder::before {
      content: "Aim at ONE code";
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: #38bdf8;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 0.8rem auto;
      max-width: 400px;
    }
    button {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #475569; }
    .card {
      max-width: 400px;
      margin: 1rem auto;
      padding: 1rem;
      background: #1e293b;
      border-radius: 12px;
      text-align: left;
    }
    .result-text {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      background: #334155;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h3>Precision QR & Barcode Scanner</h3>

  <div class="controls">
    <button id="toggle-btn">Start Camera</button>
    <button id="reset-btn" disabled style="background: #059669;">Scan Again</button>
  </div>

  <div class="scanner-wrapper">
    <video id="video" autoplay playsinline muted></video>
    <div class="viewfinder"></div>
  </div>

  <!-- Offscreen canvas used to invert and enhance frames -->
  <canvas id="proc-canvas" style="display: none;"></canvas>

  <div class="card">
    <span class="badge" id="status-badge">Status: Idle</span>
    <div><strong>Decoded Value:</strong></div>
    <div class="result-text" id="result-text">Waiting...</div>
    <div style="margin-top: 6px; font-size: 0.85rem; color: #94a3b8;">
      Mode: <span id="mode-text">Standard + Inverted Auto</span>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const toggleBtn = document.getElementById('toggle-btn');
    const resetBtn = document.getElementById('reset-btn');
    const resultText = document.getElementById('result-text');
    const statusBadge = document.getElementById('status-badge');
    const canvas = document.getElementById('proc-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let stream = null;
    let track = null;
    let scanning = false;
    let isPaused = false;
    let frameToggle = false;
    let detector = null;
    let zxingReader = null;

    if ('BarcodeDetector' in window) {
      detector = new BarcodeDetector({ formats: ['qr_code', 'ean_13', 'code_128', 'data_matrix'] });
    } else {
      zxingReader = new ZXing.BrowserMultiFormatReader();
    }

    toggleBtn.addEventListener('click', () => {
      if (scanning) stopCamera();
      else startCamera();
    });

    resetBtn.addEventListener('click', resumeScanning);

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            focusMode: { ideal: 'continuous' }
          }
        });

        video.srcObject = stream;
        await video.play();

        track = stream.getVideoTracks()[0];
        
        // Auto-apply maximum optical/digital zoom supported (around 1.5x - 2x)
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) {
          const targetZoom = Math.min(2.0, caps.zoom.max);
          await track.applyConstraints({ advanced: [{ zoom: targetZoom }] });
        }

        scanning = true;
        isPaused = false;
        toggleBtn.textContent = 'Stop Camera';
        toggleBtn.style.background = '#dc2626';
        statusBadge.textContent = 'Status: Scanning...';
        statusBadge.style.background = '#2563eb';

        requestAnimationFrame(processFrame);
      } catch (err) {
        alert('Camera Error: ' + err.message);
      }
    }

    async function processFrame() {
      if (!scanning) return;

      if (!isPaused && video.readyState === video.HAVE_ENOUGH_DATA) {
        // Crop directly to center 40% where the reticle box is located
        const cropW = video.videoWidth * 0.4;
        const cropH = video.videoWidth * 0.4;
        const cropX = (video.videoWidth - cropW) / 2;
        const cropY = (video.videoHeight - cropH) / 2;

        canvas.width = cropW;
        canvas.height = cropH;

        // Alternate passes: Frame A = Normal, Frame B = Inverted + High Contrast
        frameToggle = !frameToggle;
        if (frameToggle) {
          ctx.filter = 'none';
        } else {
          // This inverts white-on-black into black-on-white and sharpens lines
          ctx.filter = 'invert(100%) contrast(150%)';
        }

        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        try {
          if (detector) {
            const barcodes = await detector.detect(canvas);
            if (barcodes.length > 0) {
              handleSuccess(barcodes[0].rawValue);
            }
          } else if (zxingReader) {
            // ZXing canvas decode
            const imgData = ctx.getImageData(0, 0, cropW, cropH);
            // ZXing software fallback
            const luminanceSource = new ZXing.RGBLuminanceSource(imgData.data, cropW, cropH);
            const binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
            const result = new ZXing.MultiFormatReader().decode(binaryBitmap);
            if (result) handleSuccess(result.getText());
          }
        } catch (e) {
          // No barcode detected in this specific frame
        }
      }

      requestAnimationFrame(processFrame);
    }

    function handleSuccess(val) {
      isPaused = true;
      resultText.textContent = val;
      statusBadge.textContent = 'Status: Scanned!';
      statusBadge.style.background = '#059669';
      resetBtn.disabled = false;
      if (navigator.vibrate) navigator.vibrate(120);

      // Auto-unlock after 3 seconds
      setTimeout(() => {
        resumeScanning();
      }, 3000);
    }

    function resumeScanning() {
      isPaused = false;
      resetBtn.disabled = true;
      statusBadge.textContent = 'Status: Scanning...';
      statusBadge.style.background = '#2563eb';
    }

    function stopCamera() {
      scanning = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      toggleBtn.textContent = 'Start Camera';
      toggleBtn.style.background = '#2563eb';
      resetBtn.disabled = true;
      statusBadge.textContent = 'Status: Idle';
      statusBadge.style.background = '#334155';
    }
  </script>
</body>
</html>
